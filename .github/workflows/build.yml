name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          unzip -o 3106-cerrar-sesion.zip -d proyecto

      - name: Compilar aplicación
        run: |
          cd proyecto/3106-main
          xcodebuild \
            -project ThreeOneOSSix.xcodeproj \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          cd proyecto/3106-main
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/3106.app Payload/
          zip -r 3106.ipa Payload

      - name: Descargar IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3106-IPA
          path: proyecto/3106-main/3106.ipa
