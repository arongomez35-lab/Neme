name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir zip
        run: |
          unzip -o 3106-cerrar-sesion.zip -d proyecto
          ls -R proyecto | head -n 100

      - name: Buscar proyecto Xcode
        run: |
          find proyecto -name "*.xcodeproj" -o -name "*.xcworkspace"
